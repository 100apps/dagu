name: Fork push release

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ui:
    if: github.repository == '100apps/dagu'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history so `git describe` can reach the upstream release
          # tags when deriving the dev version below.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22

      - name: Resolve the version
        id: version
        run: |
          # Derive a semantic dev version from the nearest upstream release tag,
          # e.g. 2.21.0-dev.65341a4. Falls back to 0.0.0-dev.<sha> when the
          # upstream tags are unreachable.
          git fetch --quiet --depth=200 --no-tags https://github.com/dagucloud/dagu.git \
            "+refs/tags/v*:refs/tags/upstream-v*" || true
          base=$(git describe --tags --match "upstream-v*" --abbrev=0 2>/dev/null | sed "s/^upstream-v//" || true)
          base=${base:-0.0.0}
          echo "base tag: ${base}"
          echo "version=${base}-dev.${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build web UI
        run: |
          npm install --global pnpm@10
          pnpm --dir ui install --frozen-lockfile
          pnpm --dir ui build

      - name: Share web assets with all builds
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-ui
          path: ui/dist/
          retention-days: 3
          if-no-files-found: error

  build:
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux_amd64, goos: linux, goarch: amd64 }
          - { target: linux_386, goos: linux, goarch: '386' }
          - { target: linux_armv6, goos: linux, goarch: arm, goarm: '6' }
          - { target: linux_armv7, goos: linux, goarch: arm, goarm: '7' }
          - { target: linux_arm64, goos: linux, goarch: arm64 }
          - { target: linux_ppc64le, goos: linux, goarch: ppc64le }
          - { target: linux_s390x, goos: linux, goarch: s390x }
          - { target: darwin_amd64, goos: darwin, goarch: amd64 }
          - { target: darwin_arm64, goos: darwin, goarch: arm64 }
          - { target: windows_amd64, goos: windows, goarch: amd64 }
          - { target: windows_386, goos: windows, goarch: '386' }
          - { target: windows_arm64, goos: windows, goarch: arm64 }
    env:
      CGO_ENABLED: '0'
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      RELEASE_VERSION: ${{ needs.ui.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod

      - name: Restore built web assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: web-ui
          path: internal/service/frontend/assets/

      - name: Build and archive the binary
        run: |
          package_dir="${RUNNER_TEMP}/package"
          mkdir -p "$package_dir" dist
          binary=dagu
          if [[ "$GOOS" == windows ]]; then binary=dagu.exe; fi
          go build -trimpath -ldflags="-s -w -X main.version=${RELEASE_VERSION}" \
            -o "${package_dir}/${binary}" ./cmd
          cp LICENSE README.md "$package_dir/"
          tar -czf "dist/dagu_${RELEASE_VERSION}_${TARGET}.tar.gz" -C "$package_dir" .

      - name: Share the release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 3
          if-no-files-found: error

  release:
    needs: [ui, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.ui.outputs.version }}
    steps:
      - name: Collect all platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          merge-multiple: true
          path: dist/

      - name: Verify the Linux binary and write checksums
        run: |
          test "$(find dist -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 12
          tar -xzf "dist/dagu_${RELEASE_VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/dagu" version | tee "$RUNNER_TEMP/version.txt"
          grep -Fx -- "$RELEASE_VERSION" "$RUNNER_TEMP/version.txt"
          (cd dist && sha256sum *.tar.gz > checksums.txt && sha256sum --check checksums.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${RELEASE_VERSION}"
          printf 'Automatic build of `%s` at commit `%s`.\n\nIncludes the web UI. These are fork prerelease builds.\n' \
            "$GITHUB_REF_NAME" "$GITHUB_SHA" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$tag" dist/*.tar.gz dist/checksums.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "${GITHUB_REF_NAME} · ${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --prerelease
